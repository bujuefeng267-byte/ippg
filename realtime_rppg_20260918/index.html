<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>实时 rPPG</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101b26;color:#e7eef5;font:16px system-ui,sans-serif}main{max-width:1150px;margin:auto;padding:28px}h1{font-size:28px;margin:0 0 10px}.sub{color:#a8bccd;line-height:1.6}button,select{padding:10px 18px;border-radius:7px;border:0;font-size:15px;margin:10px 10px 10px 0}button{background:#57d7b6;color:#072c26;cursor:pointer}button:disabled{opacity:.5;cursor:default}#stop{background:#d7e2ec}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}.card{background:#1b2b39;border:1px solid #324858;border-radius:12px;padding:18px;margin-top:18px}video{width:100%;max-height:315px;background:#081018;border-radius:8px;object-fit:contain}.value{font-size:55px;font-weight:700;color:#6de0bd}.unit{font-size:20px;color:#bbcfdb}.status{min-height:48px;line-height:1.6}canvas.plot{width:100%;height:190px;background:#13222e;border-radius:6px}h2{font-size:18px;font-weight:600}small{color:#9eb5c7}.stats{display:flex;gap:24px;flex-wrap:wrap;margin:16px 0}.error{color:#ffbfb7;white-space:pre-wrap;overflow-wrap:anywhere}#saved{overflow-wrap:anywhere;font-size:13px}@media(max-width:750px){.grid{grid-template-columns:1fr}main{padding:16px}}
</style>
<main><h1>实时 rPPG · 波形与心率</h1><div class="sub">摄像头观察皮肤颜色变化。约 10 秒准备，随后每秒更新最近 10 秒的结果。运动或光照变化时可能暂时无法输出。</div>
<button id="start">开启摄像头</button><button id="stop" disabled>停止并保存结果</button><select id="camera"><option value="">默认摄像头</option></select><span id="message">等待开始</span>
<div class="grid"><section class="card"><video id="preview" autoplay playsinline muted></video><small>视频仅在本机处理；默认保存数值结果，不保存摄像头画面。</small></section>
<section class="card"><h2>最近 10 秒的心率估计</h2><span class="value" id="bpm">—</span><span class="unit"> bpm</span><p id="quality" class="status">等待视频输入</p><div class="stats"><span>输入 <b id="fps">—</b> fps</span><span>计算 <b id="cost">—</b> ms</span><span>结果滞后 <b id="lag">—</b> s</span></div><small>心率代表时间窗内的估计，并非拍摄时刻的瞬时心率。能输出数值不等于已验证准确。</small></section></div>
<section class="card"><h2>rPPG / BVP 波形 <small>相对幅值 · 最近时间窗</small></h2><canvas class="plot" id="wave"></canvas><small id="window">未收到完整时间窗。缺失段保留为空白。</small></section>
<section class="card"><h2>心率变化 <small>bpm</small></h2><canvas class="plot" id="hr"></canvas></section>
<p id="error" class="error"></p><p id="saved" class="sub"></p><canvas id="capture" hidden></canvas>
</main>
<script>
const token='__TOKEN__', $=id=>document.getElementById(id);
let stream=null,running=false,session=null,ownsSession=false,inflight=false,lastMedia=-1,firstMedia=null,timer=null,pollBusy=false,lastArrival=0;
async function api(path,body,headers={}){const r=await fetch(path,{method:'POST',headers:{'X-RPPG-Token':token,'X-Session':session||'',...headers},body});const d=await r.json();if(!r.ok)throw Error(d.error||r.statusText);return d}
const statusNames={candidate_only:'已输出候选心率',insufficient_sampling:'实际采样帧率不足',no_qualified_roi_consensus:'皮肤区域信号不足或不一致',no_supported_candidate:'没有可信的频率候选',warming_up:'正在准备信号',accepted:'已输出候选心率',insufficient_samples:'有效皮肤样本不足',insufficient_coverage:'有效皮肤样本不足',missing_samples:'存在缺失样本',no_signal:'没有可用脉搏波形',low_quality:'信号质量不足',low_sampling_rate:'输入帧率不足'};
function plot(id,x,y,lo=null,hi=null){const c=$(id),r=c.getBoundingClientRect(),d=devicePixelRatio||1;c.width=Math.round(r.width*d);c.height=Math.round(r.height*d);const g=c.getContext('2d');g.scale(d,d);const w=r.width,h=r.height,p=38;g.clearRect(0,0,w,h);const good=y.filter(Number.isFinite);if(!x.length||!good.length){g.fillStyle='#9eb5c7';g.fillText('暂无有效输出',p,h/2);return}lo=lo??Math.min(...good);hi=hi??Math.max(...good);if(hi-lo<1e-6){lo-=1;hi+=1}const xmin=Math.min(...x),xmax=Math.max(...x),sx=t=>p+(t-xmin)/(xmax-xmin||1)*(w-p-12),sy=v=>h-26-(v-lo)/(hi-lo)*(h-45);g.font='12px system-ui';g.fillStyle='#9eb5c7';g.strokeStyle='#304958';for(let i=0;i<3;i++){const v=lo+(hi-lo)*i/2;g.beginPath();g.moveTo(p,sy(v));g.lineTo(w-12,sy(v));g.stroke();g.fillText(v.toFixed(1),2,sy(v)+4)}g.fillText(xmin.toFixed(1)+' s',p,h-7);g.fillText(xmax.toFixed(1)+' s',w-72,h-7);g.strokeStyle='#6de0bd';g.lineWidth=1.5;g.beginPath();let pen=false;for(let i=0;i<x.length;i++){if(!Number.isFinite(y[i])){pen=false;continue}if(pen)g.lineTo(sx(x[i]),sy(y[i]));else g.moveTo(sx(x[i]),sy(y[i]));pen=true}g.stroke()}
async function poll(){if(pollBusy)return;pollBusy=true;try{const r=await fetch('/api/status',{headers:{'X-RPPG-Token':token}});const d=await r.json();if(d.error)throw Error(d.error);if(!d.active&&!running){session=null;$('start').disabled=false;$('stop').disabled=true;}if(d.active&&!session){session=d.session;$('start').disabled=true;$('stop').disabled=false;$('message').textContent='正在显示已有会话'}$('fps').textContent=(d.input_fps||0).toFixed(1);$('saved').textContent=d.output?'结果目录：'+d.output:'';const e=d.latest;if(e){const stale=(running&&performance.now()-lastArrival>2500)||(d.latest_age_s||0)>2.5||(d.active&&(d.input_stale_wall_s||0)>2.5);const hr=e.hr_bpm;$('bpm').textContent=!stale&&e.accepted&&Number.isFinite(hr)?Math.round(hr):'—';$('cost').textContent=Number(e.processing_ms||0).toFixed(0);$('lag').textContent=Number(d.latest_age_s||0).toFixed(2);$('quality').textContent=!d.active?'已停止；当前显示历史结果':stale?'视频输入已暂停':(statusNames[e.status]||e.status||'等待信号');const a=e.waveform||{};plot('wave',a.time_s||[],a.values||[]);$('window').textContent=`视频 ${e.window_start_s.toFixed(2)}–${e.window_end_s.toFixed(2)} 秒；每次显示独立时间窗，缺失值不补零。`;plot('hr',(d.history||[]).map(z=>z.window_end_s),(d.history||[]).map(z=>z.accepted?z.hr_bpm:null),40,210)}else{$('quality').textContent=`正在准备：${Math.min(10,d.source_elapsed_s||0).toFixed(1)} / 10 秒`}}catch(e){$('error').textContent=e.message}finally{pollBusy=false}}
async function sendFrame(now,meta){if(!running)return;const media=meta?.mediaTime??$('preview').currentTime;if(!inflight&&media!==lastMedia&&$('preview').videoWidth){inflight=true;lastMedia=media;if(firstMedia===null)firstMedia=media;const c=$('capture'),v=$('preview'),ratio=Math.min(1,960/v.videoWidth);c.width=Math.round(v.videoWidth*ratio);c.height=Math.round(v.videoHeight*ratio);c.getContext('2d').drawImage(v,0,0,c.width,c.height);try{const blob=await new Promise(resolve=>c.toBlob(resolve,'image/jpeg',.98));if(!blob)throw Error('无法编码摄像头画面');if(running){await api('/api/frame',blob,{'X-Capture-Time':String(media-firstMedia)});lastArrival=performance.now()}}catch(e){$('error').textContent=e.message;await stop()}finally{inflight=false}}if(running)schedule()}
function schedule(){const v=$('preview');if(v.requestVideoFrameCallback)v.requestVideoFrameCallback(sendFrame);else requestAnimationFrame(sendFrame)}
async function stop(){running=false;$('stop').disabled=true;stream?.getTracks().forEach(t=>t.stop());stream=null;try{if(session)await api('/api/stop');await poll()}catch(e){$('error').textContent=e.message}session=null;ownsSession=false;clearInterval(timer);$('start').disabled=false;$('camera').disabled=false;$('message').textContent='已停止';$('quality').textContent='已停止；图表为本次会话历史结果'}
$('start').onclick=async()=>{$('start').disabled=true;$('error').textContent='';try{if(!navigator.mediaDevices?.getUserMedia)throw Error('请在电脑 Chrome / Edge 中打开 localhost 地址');const id=$('camera').value;stream=await navigator.mediaDevices.getUserMedia({video:{width:{ideal:960},height:{ideal:720},frameRate:{ideal:30},...(id?{deviceId:{exact:id}}:{})},audio:false});$('preview').srcObject=stream;await $('preview').play();const d=await api('/api/start');session=d.session;ownsSession=true;firstMedia=null;lastMedia=-1;running=true;lastArrival=performance.now();$('stop').disabled=false;$('camera').disabled=true;$('message').textContent='正在采集';const devices=await navigator.mediaDevices.enumerateDevices();$('camera').innerHTML='';for(const dev of devices.filter(x=>x.kind==='videoinput')){const o=document.createElement('option');o.value=dev.deviceId;o.textContent=dev.label||'摄像头';$('camera').appendChild(o)}$('camera').value=stream.getVideoTracks()[0].getSettings().deviceId||'';clearInterval(timer);timer=setInterval(poll,500);schedule()}catch(e){$('error').textContent=e.name==='NotAllowedError'?'摄像头权限未开启，请允许此页面使用摄像头。':e.message;await stop()}};
$('stop').onclick=stop;
window.addEventListener('beforeunload',()=>{stream?.getTracks().forEach(t=>t.stop());if(session&&ownsSession)fetch('/api/stop',{method:'POST',headers:{'X-RPPG-Token':token,'X-Session':session},keepalive:true}).catch(()=>{})});
plot('wave',[],[]);plot('hr',[],[]);poll();timer=setInterval(poll,500);
</script></html>
